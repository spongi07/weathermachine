# Weather Machine — Portainer stack (also works with plain `docker compose`).
#
# Portainer: Stacks → Add stack → Repository
#   Repository URL : https://github.com/spongi07/weathermachine
#   Compose path   : docker-compose.yml
#   Environment    : at least WM_DB_PASSWORD, WM_CONTACT, WM_ADMIN_TOKEN
# Full guide: docs/deployment/portainer.md · variables: stack.env.example
#
# Paper trading, plus strategy G's live twin when WM_LIVE_G=true and the
# wallet is set (docs/deployment/live.md); everything else stays on paper.

name: weather-machine

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  logging: *logging

services:
  postgres:
    <<: *hardening
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: wm
      POSTGRES_DB: weather_machine
      POSTGRES_PASSWORD: ${WM_DB_PASSWORD:?WM_DB_PASSWORD must be set}
      # Enforce password auth for network connections (default for new clusters).
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      # PostgreSQL 18 images keep the cluster under /var/lib/postgresql/18/docker.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wm -d weather_machine"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    shm_size: 128mb
    stop_grace_period: 60s
    deploy:
      resources:
        limits:
          memory: 1g

  weather-machine:
    <<: *hardening
    image: ghcr.io/spongi07/weathermachine:${WM_IMAGE_TAG:-latest}
    command: ["run"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      WM_MODE: paper
      WM_DB_HOST: postgres
      WM_DB_USER: wm
      WM_DB_NAME: weather_machine
      WM_DB_PASSWORD: ${WM_DB_PASSWORD:?WM_DB_PASSWORD must be set}
      # NOAA/NWS require an identifying User-Agent with a contact (e-mail or URL).
      WM_CONTACT: ${WM_CONTACT:?WM_CONTACT must be set (e-mail or URL for the NOAA User-Agent)}
      # Operator token for the kill switch (dashboard + API). Empty = disabled.
      WM_ADMIN_TOKEN: ${WM_ADMIN_TOKEN:-}
      # Optional HTTP Basic auth for the dashboard/API (set both or neither).
      WM_DASHBOARD_USER: ${WM_DASHBOARD_USER:-}
      WM_DASHBOARD_PASSWORD: ${WM_DASHBOARD_PASSWORD:-}
      # Model file; unset = /data/models/eham.json, trained automatically on
      # first start from IEM METAR history (loaded without a restart) and
      # retrained in the background every 30 days.
      WM_MODEL_PATH: ${WM_MODEL_PATH:-}
      WM_MODEL_AUTO_TRAIN: ${WM_MODEL_AUTO_TRAIN:-true}
      # Day-1 forecast (Open-Meteo). Used by the model only if the training
      # evaluation proves it helps; false = never fetched.
      WM_FORECAST: ${WM_FORECAST:-true}
      WM_FORECAST_MODEL: ${WM_FORECAST_MODEL:-gfs_global}
      # Open-Meteo subscription key (commercial use). Empty = free tier.
      WM_OPEN_METEO_API_KEY: ${WM_OPEN_METEO_API_KEY:-}
      # Free KNMI Data Platform key: ten-minute readings for strategy K. Empty =
      # K does nothing. Sent only in the Authorization header, never logged.
      WM_KNMI_API_KEY: ${WM_KNMI_API_KEY:-}
      # Days of order-book updates kept in the replay journal, and of the
      # recorded market history (the sampled books); both bound disk use.
      WM_JOURNAL_RETENTION_DAYS: ${WM_JOURNAL_RETENTION_DAYS:-7}
      WM_BOOK_HISTORY_DAYS: ${WM_BOOK_HISTORY_DAYS:-14}
      # Free disk (GB) under which an alert and a Pushover message say the
      # disk is filling, and under which order books stop being written.
      WM_DISK_WARN_FREE_GB: ${WM_DISK_WARN_FREE_GB:-5}
      WM_DISK_BRAKE_FREE_GB: ${WM_DISK_BRAKE_FREE_GB:-2}
      # Strategy G's live twin: REAL orders on Polymarket (off by default).
      # Guide: docs/deployment/live.md. The key is read once, never logged.
      WM_LIVE_G: ${WM_LIVE_G:-false}
      WM_POLY_PRIVATE_KEY: ${WM_POLY_PRIVATE_KEY:-}
      WM_POLY_FUNDER: ${WM_POLY_FUNDER:-}
      WM_POLY_SIG_TYPE: ${WM_POLY_SIG_TYPE:-1}
      # A Pushover message for every settled market of the live twin, for
      # every live order that bought shares, and when the disk is filling
      # up: the application's API token and
      # your user key (both secret). WM_PUSHOVER_STRATEGIES: live (the
      # default) | all | strategy ids or letters, e.g. GL,G.
      WM_PUSHOVER_TOKEN: ${WM_PUSHOVER_TOKEN:-}
      WM_PUSHOVER_USER: ${WM_PUSHOVER_USER:-}
      WM_PUSHOVER_STRATEGIES: ${WM_PUSHOVER_STRATEGIES:-}
      WM_LOG_FORMAT: ${WM_LOG_FORMAT:-json}
      RUST_LOG: ${RUST_LOG:-info,sqlx=warn,hyper=warn,reqwest=warn,tungstenite=warn}
    ports:
      - "${WM_HTTP_PORT:-8080}:8080"
    volumes:
      - wmdata:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    user: "65532:65532"
    healthcheck:
      test: ["CMD", "/usr/local/bin/weather-machine", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768m

  # A daily logical backup of the audit database into the `backups` volume:
  # the newest WM_BACKUP_KEEP_DAYS dumps are kept (one a day; a restart, as
  # every redeploy is one, adds none), and a dump the disk has no room for
  # (twice the last one and 1 GB) is skipped and says so. The volume shares
  # the database's disk. Restore: pg_restore -d weather_machine <file>.
  db-backup:
    <<: *hardening
    image: postgres:18-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: wm
      PGDATABASE: weather_machine
      PGPASSWORD: ${WM_DB_PASSWORD:?WM_DB_PASSWORD must be set}
      BACKUP_KEEP_DAYS: ${WM_BACKUP_KEEP_DAYS:-14}
      # The replay journal (every engine input, mostly order-book updates) and
      # the recorded market history (the sampled books, a few hundred MB a
      # day) are most of the database and are recorded anew every day; until
      # 17 October 2026 every dump held the whole market history (that day
      # the disk was full). The audit trail (observations, raw payloads,
      # decisions, orders, fills, markets) is always backed up. true includes
      # the journal or the books anyway.
      BACKUP_JOURNAL: ${WM_BACKUP_JOURNAL:-false}
      BACKUP_BOOKS: ${WM_BACKUP_BOOKS:-false}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        keep="$${BACKUP_KEEP_DAYS}"
        while true; do
          # a dump cut off by a restart: nothing writes one now
          rm -f /backups/weather_machine-*.dump.partial
          newest="$$(ls -1t /backups/weather_machine-*.dump 2>/dev/null | head -n 1 || true)"
          if [ -n "$$newest" ] && [ -n "$$(find "$$newest" -mmin -1410)" ]; then
            : # the day's dump exists
          else
            skip=""
            [ "$${BACKUP_JOURNAL}" = "true" ] || skip="--exclude-table-data=event_journal"
            [ "$${BACKUP_BOOKS}" = "true" ] || skip="$$skip --exclude-table-data=orderbook_snapshots"
            last_kb=0
            [ -z "$$newest" ] || last_kb=$$(( $$(stat -c %s "$$newest") / 1024 ))
            need_kb=$$(( 2 * last_kb + 1048576 ))
            free_kb=$$(df -Pk /backups | awk 'NR == 2 { print $$4 }')
            if [ "$$free_kb" -lt "$$need_kb" ]; then
              echo "backup SKIPPED: $$(( free_kb / 1024 )) MB free on the disk, $$(( need_kb / 1024 )) MB wanted" >&2
            else
              f="/backups/weather_machine-$$(date -u +%Y%m%dT%H%M%SZ).dump"
              if pg_dump --format=custom $${skip} --file="$$f.partial" && mv "$$f.partial" "$$f"; then
                echo "backup written: $$f ($$(( $$(stat -c %s "$$f") / 1048576 )) MB)"
              else
                echo "backup FAILED" >&2
                rm -f "$$f.partial"
              fi
            fi
          fi
          ls -1t /backups/weather_machine-*.dump 2>/dev/null | tail -n +$$(( keep + 1 )) | xargs -r rm -f
          sleep 3600
        done
    volumes:
      - backups:/backups
    deploy:
      resources:
        limits:
          memory: 256m

volumes:
  pgdata: {}
  wmdata: {}
  backups: {}
