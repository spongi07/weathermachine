[package]
name = "wm-ui"
description = "Weather Machine trading dashboard: Rust compiled to WebAssembly (Leptos, client-side rendering)."
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "LicenseRef-Proprietary"
publish = false

# Standalone workspace: the UI targets wasm32 and is excluded from the server workspace.
[workspace]

[dependencies]
wm-dashboard-api = { path = "../crates/wm-dashboard-api" }
leptos = { version = "0.8.20", features = ["csr"] }
serde_json = "1.0.151"
# Must match the wasm-bindgen CLI used to generate the JS glue exactly.
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4.79"
js-sys = "0.3.106"
web-sys = { version = "0.3.106", features = [
    "console",
    "Document",
    "Element",
    "HtmlElement",
    "Node",
    "Event",
    "EventSource",
    "EventTarget",
    "Headers",
    "HtmlDocument",
    "HtmlInputElement",
    "HtmlTextAreaElement",
    "Navigator",
    "Clipboard",
    "Location",
    "MessageEvent",
    "Request",
    "RequestInit",
    "Response",
    "Window",
] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
