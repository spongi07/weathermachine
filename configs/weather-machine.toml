circuit_open_max_secs = 1800.0
daily_budget = 2000
politeness_factor = 2
politeness_decay_secs = 3600.0
max_body_bytes = 8388608

# Iowa Environmental Mesonet ASOS/METAR archive: history for model training
# only (never live or resolution data). IEM throttles each IP to one request
# per second and allows at most 1,000 station-years per request; we fetch one
# station-year per request, one at a time, 15 s apart, and cache finished years.
[providers.iem]
enabled = true
base_url = "https://mesonet.agron.iastate.edu"
[providers.iem.policy]
class = "public_data"
min_interval_secs = 15.0
max_concurrency = 1
timeout_secs = 180.0
connect_timeout_secs = 20.0
backoff_base_secs = 60.0
backoff_max_secs = 3600.0
throttle_backoff_base_secs = 600.0
respect_retry_after = true
max_retry_after_secs = 21600.0
circuit_failure_threshold = 3
circuit_open_base_secs = 1800.0
circuit_open_max_secs = 21600.0
daily_budget = 200
politeness_factor = 2
politeness_decay_secs = 86400.0
max_body_bytes = 16777216

# Open-Meteo Previous Runs API: the day-1 forecast (each hourly value from the
# run initialised 24 h earlier), a predictive input only. One request per
# location per refresh, one per year of history when training; one at a
# time, 10 s apart. The free tier is for non-commercial use: for real-money
# trading set WM_OPEN_METEO_API_KEY (a subscription), which switches to the
# customer host automatically.
[providers.open_meteo]
enabled = true
base_url = "https://previous-runs-api.open-meteo.com"
[providers.open_meteo.policy]
class = "public_data"
min_interval_secs = 10.0
max_concurrency = 1
timeout_secs = 60.0
connect_timeout_secs = 10.0
backoff_base_secs = 60.0
backoff_max_secs = 3600.0
throttle_backoff_base_secs = 900.0
respect_retry_after = true
max_retry_after_secs = 86400.0
circuit_failure_threshold = 3
circuit_open_base_secs = 1800.0
circuit_open_max_secs = 21600.0
daily_budget = 500
politeness_factor = 2
politeness_decay_secs = 86400.0
max_body_bytes = 4194304

# ---------------------------------------------------------------------------
# Adaptive polling (engineering starting points — NOT optimized parameters).
# Fast intervals apply only inside the arrival window after an expected report.
# ---------------------------------------------------------------------------
[polling]
night_start_minute = 1320         # 22:00 local
night_end_minute = 300            # 05:00 local
stale_slowdown_after_secs = 7200
stale_interval_secs = 1200
[polling.low]
window_interval_secs = 120
background_interval_secs = 900
max_polls_per_window = 3
[polling.normal]
window_interval_secs = 60
background_interval_secs = 600
max_polls_per_window = 6
[polling.peak]
window_interval_secs = 30
background_interval_secs = 300
max_polls_per_window = 10

[health]
stale_after_secs = 2700           # 30-min cadence + 15-min allowance
degraded_latency_ms = 5000
unavailable_after_failures = 3
throttle_memory_secs = 1800

# ---------------------------------------------------------------------------
# Risk ($10 per position, $100 global worst-case exposure). FAIL CLOSED.
# ---------------------------------------------------------------------------
[risk]
position_size_usd = "10.00"
global_max_exposure_usd = "100.00"
max_market_exposure_usd = "30.00"
max_location_exposure_usd = "50.00"
max_strategy_exposure_usd = "60.00"
max_daily_new_exposure_usd = "60.00"
max_daily_loss_usd = "30.00"
max_spread = "0.05"
max_price = "0.99"
min_price = "0.01"
max_weather_age_minutes = 40
max_book_age_ms = 15000
correction_cooldown_minutes = 10
max_orders_per_minute = 6
require_approved_resolution_spec = false   # set true before any live consideration

# ---------------------------------------------------------------------------
# Strategies (research parameters; see docs/blueprint/14-research-methodology.md)
# ---------------------------------------------------------------------------
[strategies.buy_yes]
enabled = true
min_price = "0.90"
max_price = "0.99"
min_confirmation_minutes = 60
min_edge = 0.01
min_model_support = 50
max_data_age_minutes = 40
max_book_age_ms = 15000
slippage_allowance = "0.005"

[strategies.buy_no]
enabled = true
distances = [1, 2, 3]
min_price = "0.90"
max_price = "0.99"
min_confirmation_minutes = 60
min_edge = 0.01
min_model_support = 50
max_data_age_minutes = 40
max_book_age_ms = 15000
slippage_allowance = "0.005"

[strategies.split_unwind]
enabled = false                   # research only; risk rejects outside backtests
max_confirmation_minutes = 30
min_combined_p = 0.90
max_combined_price = "0.95"
max_data_age_minutes = 40

[strategies.unwind]
enabled = true
exit_below_probability = 0.5
[strategies.unwind.style]
style = "best_bid"

[model]
# Trained EmpiricalPeakModel JSON. Unset: <auto_train.data_dir>/models/<station>.json
# (e.g. /data/models/eham.json). Until a model exists the engine uses the
# no-edge model: no weather-dependent trades (fail closed).
# path = "/data/models/eham.json"

# When the model file is missing, `run` downloads the station's METAR history
# from IEM (cached per year under data_dir/research/iem), trains the model,
# writes it and the survival report, and restarts once to load it.
# Disable with WM_MODEL_AUTO_TRAIN=false. Manual: `weather-machine model train`.
[model.auto_train]
enabled = true
data_dir = "/data"
from_year = 2005
min_days = 730                    # refuse a model built from fewer usable days
retry_after_secs = 21600          # after a failed attempt
retrain_after_days = 30           # background retrain (current model keeps trading); 0 = never

# ---------------------------------------------------------------------------
# Day-1 forecast as a model feature — MEASURED, NOT ASSUMED. Training joins
# the forecast history with the METAR history and runs a walk-forward test
# with a placebo control (docs/blueprint/19-forecast-layer.md). The forecast
# changes trading probabilities only if that test adopts it; otherwise it is
# fetched and shown on the dashboard, nothing more. WM_FORECAST=false turns
# it off entirely.
# ---------------------------------------------------------------------------
[forecast]
enabled = true
model = "gfs_global"              # 2 m temperature archived since 2021 (longest history)
lead_days = 1                     # every value forecast 24 h before its valid time
ready_local_minute = 480          # a day's series is used from 08:00 local (knowledge rule)
refresh_minutes = 60
history_from = "2021-03-01"
min_eval_days = 365               # the test needs at least a year of scored days
