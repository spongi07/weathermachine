# ---------------------------------------------------------------------------
# Adaptive polling (engineering starting points — NOT optimized parameters).
# Fast intervals apply only inside the arrival window after an expected report:
# up to max_polls_per_window quick polls every window_interval_secs, then one
# every late_interval_secs until the window closes (a late report is still seen
# within a minute or two), then the background interval.
# ---------------------------------------------------------------------------
[polling]
night_start_minute = 1320         # 22:00 local
night_end_minute = 300            # 05:00 local
stale_slowdown_after_secs = 7200
stale_interval_secs = 1200
# While a window poll finds the expected report missing, also ask the standby
# source (TGFTP) whenever its own gate allows. The report records which source
# delivered each METAR first.
poll_standby_in_window = true
[polling.low]
window_interval_secs = 120
late_interval_secs = 180
background_interval_secs = 900
max_polls_per_window = 3
[polling.normal]
window_interval_secs = 60
late_interval_secs = 90
background_interval_secs = 600
max_polls_per_window = 6
[polling.peak]
window_interval_secs = 30
late_interval_secs = 60
background_interval_secs = 300
max_polls_per_window = 10

[health]
stale_after_secs = 2700           # 30-min cadence + 15-min allowance
degraded_latency_ms = 5000         # average and latest request both slower ⇒ Degraded
unavailable_after_failures = 3
throttle_memory_secs = 1800

# ---------------------------------------------------------------------------
# Risk (paper money). FAIL CLOSED. The strategies that run — F and G–K —
# each have their own position and capital caps at the end of [risk]; the
# portfolio-wide caps fit all of them at once.
# ---------------------------------------------------------------------------
[risk]
position_size_usd = "10.00"          # any strategy without its own caps
# F ≤ $110 + G $120 + I $30 + K $50 = $310 of capital at most (H's $30
# and J's $80 more if they are switched back on). The worst-case loss counts
# the worst outcome of each market, where legs of different buckets hedge
# each other, so it stays below that.
global_max_exposure_usd = "400.00"
max_market_exposure_usd = "400.00"   # one market a day: the same as the location
max_location_exposure_usd = "400.00"
max_strategy_exposure_usd = "60.00"
# Filled opening orders and live ones count; an order that ends unfilled (a
# resting quote that expires, a fill-and-kill that finds nothing) gives its
# unfilled cost back.
max_daily_new_exposure_usd = "600.00"
max_daily_loss_usd = "100.00"
max_spread = "0.05"
max_price = "0.99"
min_price = "0.01"
max_weather_age_minutes = 40
max_book_age_ms = 15000
correction_cooldown_minutes = 10
max_orders_per_minute = 20           # G and J post several quotes after a report
require_approved_resolution_spec = false   # set true before any live consideration
# F buys a fixed 100 shares (at most 0.95 each).
[risk.strategy_caps.F_peak_slot]
position_size_usd = "100.00"
max_strategy_exposure_usd = "110.00"
# G: $30 a resting NO bid, at most four buckets at a time.
[risk.strategy_caps.G_tail_seller]
position_size_usd = "30.00"
max_strategy_exposure_usd = "120.00"
# H: $10 a trade, at most three positions.
[risk.strategy_caps.H_next_degree]
position_size_usd = "10.00"
max_strategy_exposure_usd = "30.00"
# I: $10 a trade, at most three positions.
[risk.strategy_caps.I_middle_fade]
position_size_usd = "10.00"
max_strategy_exposure_usd = "30.00"
# J: $10 a quote, both sides of up to four buckets.
[risk.strategy_caps.J_morning_maker]
position_size_usd = "10.00"
max_strategy_exposure_usd = "80.00"
# K: $25 a trade. It trades in the minutes before a report, when makers
# widen their quotes, so its books may be up to 0.10 wide.
[risk.strategy_caps.K_knmi_nowcast]
position_size_usd = "25.00"
max_strategy_exposure_usd = "50.00"
max_spread = "0.10"

# ---------------------------------------------------------------------------
# Strategies (research parameters; see docs/blueprint/14-research-methodology.md)
# ---------------------------------------------------------------------------
# The book is information. A and B pool the model's probability with the
# market's (midpoint of a fresh book with spread <= max_market_spread):
# logit(p) = w·logit(market) + (1−w)·logit(model), capped at the model's
# probability — the market can veto a trade, never create one. With
# market_weight > 0 a book too wide (or one-sided, or crossed) to give that
# midpoint blocks the trade: nothing checks the model then.
# market_weight: 0 = model only, 1 = market only. `weather-machine research
# market` estimates the best weight from settled markets.
# A, B and D are switched off since 1 October 2026: none of them traded on
# 30 September or 1 October, and in the 122-day replay at traded prices the
# live A/B rule made 6 trades for −$5.95 (B at every setting lost). Their
# code stays: `research market` replays A and B as baselines, and setting
# `enabled = true` brings one back (on the dashboard too).
[strategies.buy_yes]
enabled = false
min_price = "0.90"
max_price = "0.99"
min_confirmation_minutes = 60
min_edge = 0.01
min_model_support = 50
max_data_age_minutes = 40
max_book_age_ms = 15000
slippage_allowance = "0.005"
market_weight = 0.5
max_market_spread = "0.10"

[strategies.buy_no]
enabled = false
distances = [1, 2, 3]
min_price = "0.90"
max_price = "0.99"
min_confirmation_minutes = 60
min_edge = 0.01
min_model_support = 50
max_data_age_minutes = 40
max_book_age_ms = 15000
slippage_allowance = "0.005"
market_weight = 0.5
max_market_spread = "0.10"

# Strategy D: outcomes the observations have decided. When every resolution
# view has seen a high of H, buckets entirely below H lose (buy their NO) and
# an open-ended top bucket "≥ L" with L ≤ H wins (buy its YES) — no model.
# The edge is speed: quotes on the bucket that just died can be stale for a
# moment after the report. A high more than max_jump_tenths above the report
# before it waits for a second report. Off since 1 October 2026: dead
# buckets reprice within a median 39 s of the observation, before the bot
# knows the report (observation + 2–5 min), so D never traded.
[strategies.certain]
enabled = false
max_price = "0.99"
min_edge = 0.02                   # profit per share after fee and slippage; skips 0.98–0.99 asks
                                  # on long-dead buckets (settlement discount, not a stale quote)
slippage_allowance = "0.002"
max_data_age_minutes = 40
max_book_age_ms = 15000
max_jump_tenths = 30

# Strategy E: buy YES on the bucket holding the day's high once the clock,
# the temperature and the order book agree — inside the local time window,
# the high first reached ≥ min_minutes_at_high ago and the latest report
# ≥ min_drop_tenths below it, the YES shares offered up to max_price down by
# ≥ min_depth_shrink over lookback_minutes with the best ask not falling, and
# the ask within [min_price, max_price]. Rule-based: it claims no model edge,
# but like A and B it stays silent without a loaded model, and min_model_p > 0
# also makes the model's probability a veto. Its premise — late favourites
# win slightly more often than their price — is thin against fee and spread,
# so treat it as a hypothesis: `research market` replays it at traded prices.
# Switched off: in the 120-day replay it won 76 of 79 trades and still lost
# $7.72, and live its conditions never held while the ask was in range.
# Its losses would also count toward the daily loss limit F needs. The
# replay keeps showing what it would have done; its page keeps its history.
[strategies.book_confirmed]
enabled = false
start_local_minute = 720          # 12:00 local
end_local_minute = 1080           # 18:00 local (exclusive)
min_minutes_at_high = 60          # since the first report at the high
min_drop_tenths = 10              # latest report ≥ 1.0 °C below the high
lookback_minutes = 30
min_depth_shrink = 0.30           # ≥ 30 % of the offered shares gone
min_depth_shares = 50.0           # fewer offered at the start: no signal
min_price = "0.90"
max_price = "0.99"
min_model_p = 0.0                 # 0 = no veto; e.g. 0.90 to require the model's agreement
max_data_age_minutes = 40
max_book_age_ms = 15000
slippage_allowance = "0.005"      # for the EV shown (not a gate)

# Strategy F — the high's bucket inside the season's peak slot. The model's
# training learns, per season, the local time at which each day's high was
# first reported (METAR history); F trades between two quantiles of it. When
# the bucket holding the day's high so far is offered above min_price, F buys
# `shares` of its YES at once, paying at most max_price for every share.
# HYPOTHESIS TO BACKTEST: `research market` replays F and its variants.
# Slot: the operator's choice after the 122-day replay (1 Oct 2026), where
# the median → 90 % slot lost $122 over 84 trades and 75 % → 95 % made $11
# over 80 (per trade about +$0.14, 95 % CI −$5.93 … +$5.14). That is within
# noise and was picked after seeing the data: a hypothesis to confirm on
# later days, not an edge. The replay keeps reporting the median slot.
[strategies.peak_slot]
enabled = true
slot_from_quantile = 0.75         # from the time 75 % of days first report their high
slot_to_quantile = 0.95           # … to the time 95 % of days have it
min_price = "0.90"                # the best ask must be above this
max_price = "0.95"                # all shares at or below this
shares = 100
min_drop_tenths = 0               # 0 = no temperature condition (10 = ≥ 1 °C below the high)
max_data_age_minutes = 40
max_book_age_ms = 15000
slippage_allowance = "0.005"      # for the EV shown (not a gate)
# Only until the model carries the history's peak times (local time):
[strategies.peak_slot.fallback_slots]
winter = "13:00-16:00"
spring = "14:30-17:30"
summer = "15:00-18:00"
autumn = "14:00-17:00"

[strategies.split_unwind]
enabled = false                   # research only; risk rejects outside backtests
max_confirmation_minutes = 30
min_combined_p = 0.90
max_combined_price = "0.95"
max_data_age_minutes = 40

# ---------------------------------------------------------------------------
# Strategies G–K (1 October 2026), chosen from the 122-day replay of the
# settled Amsterdam markets at traded prices (June–September 2026) and the
# prediction-market literature. Every one is a HYPOTHESIS: `research market`
# replays G–J at traded prices (K with WM_KNMI_API_KEY) and judges each on
# the second half of the days (docs/blueprint/06-strategy.md §27e–§27i).
# Each needs its own risk caps (above) and is off when its section is
# missing. Their positions are held to settlement: the unwind engine leaves
# them alone (exempt_strategies below).
# ---------------------------------------------------------------------------

# G — tail seller: rest a NO bid (an offer of the YES) on cheap buckets two
# or more degrees above the day's high. Longshots are overpriced: YES at
# 0.00–0.02 won 0.1 % at a mean price of 0.4 %, and the makers facing the
# takers who bought them earned +0.34¢ a share (95 % CI +0.26 … +0.41),
# +1.04¢ on buckets two above the high (−0.06 … +2.27).
# Replay of 2 October 2026 (123 days at traded prices): from two degrees
# above the high G lost $18.04 over 37 trades (two of those tails won);
# from three above all 15 trades won, +$18.74, and so did its one trade in
# August–September (the out-of-sample half). A small earner, not a big one.
[strategies.tail_seller]
enabled = true
min_distance = 3                  # every value of the bucket ≥ high + 3
min_yes_price = "0.01"            # the YES offered (1 − the NO bid) …
max_yes_price = "0.08"            # … in this range
max_model_ratio = 1.0             # the model's probability ≤ 1.0 × that price
start_local_minute = 600          # 10:00 local
end_local_minute = 1260           # 21:00 local (exclusive)
notional = "30.00"                # per order, at the NO price
cancel_before_report_minutes = 10 # orders expire 10′ before each routine report
min_rest_minutes = 3              # … and are not posted with less time left
max_data_age_minutes = 40
max_book_age_ms = 15000

# H — next degree: YES on the bucket one degree above the high while the day
# can still warm. On that bucket takers gained +0.78¢ a share and the makers
# against them lost 0.68¢ (95 % CI −1.27 … −0.10); B, buying the NO above the
# high, lost at every setting; YES at 0.10–0.30 won 21.0 % at 18.7 %.
# Switched off on 2 October 2026: in the replay (123 days at traded prices)
# H lost $77.18 over 169 trades, and its best variant on June–July (as a
# resting bid, +$159.31) lost $92.20 on August–September.
[strategies.next_degree]
enabled = false
min_price = "0.05"                # the ask of the next degree …
max_price = "0.35"                # … and the whole size at or below this
start_local_minute = 600          # 10:00 local …
until_quantile = 0.75             # … until 75 % of the season's days had reported their high
fallback_end_local_minute = 930   # 15:30 local, until the model carries peak times
max_drop_tenths = 10              # the latest report within 1.0 °C of the high
min_model_ratio = 1.0             # the model's probability ≥ 1.0 × the ask
notional = "10.00"
max_data_age_minutes = 40
max_book_age_ms = 15000
slippage_allowance = "0.005"      # for the EV shown (not a gate)

# I — middle fade: NO on buckets whose YES trades at 0.30–0.70 when the model
# rates them lower. They won 45.4 % at a mean price of 48.5 % (95 % CI
# 42.8 … 48.0 %); with the model ≥ 5 points below, 51.1 % at 53.6 %. The
# three-point edge is about what the fee and half the spread cost, so I
# trades only on tight books.
[strategies.middle_fade]
enabled = true
min_mid = 0.30
max_mid = 0.70
max_spread = "0.04"               # widest YES spread whose midpoint counts
min_model_gap = 0.05              # the model ≥ 5 points below the midpoint
calibration_bias = 0.03           # the measured overpricing, taken off the midpoint
min_edge = 0.0                    # EV per NO share after the fee and slippage
start_local_minute = 540          # 09:00 local
end_local_minute = 1080           # 18:00 local (exclusive)
notional = "10.00"
max_data_age_minutes = 40
max_book_age_ms = 15000
slippage_allowance = "0.005"

# J — morning maker: a YES bid and a NO bid one tick inside the spread on
# mid-priced buckets before 11:00. Makers earned +0.71¢ a share the evening
# before, +0.61¢ from 00:00 to 09:00 and +0.47¢ from 09:00 to 12:00 (each
# interval spans zero) and lost in the afternoon and before reports, so the
# quotes stop at 11:00 and expire 10′ before each report.
# Switched off on 2 October 2026: in the replay J lost $197.52 over 250
# filled quotes, and its best variant on June–July (YES bids only, +$28.88)
# lost $171.88 on August–September (95 % CI −5.87 … −0.22 a trade): its
# fills come mostly from takers who know better.
[strategies.morning_maker]
enabled = false
start_local_minute = 0
end_local_minute = 660            # 11:00 local (exclusive)
min_mid = 0.10
max_mid = 0.90
min_spread = "0.02"               # room to bid a tick inside
max_spread = "0.05"
notional = "10.00"                # per quote
cancel_before_report_minutes = 10
min_rest_minutes = 3
max_data_age_minutes = 40
max_book_age_ms = 15000

# K — KNMI nowcast: when KNMI's ten-minute reading just before the next
# METAR is 0.8 °C above the high (the rounding edge plus 0.3), buy the NO of
# the high's bucket before the METAR reports the new high. In the replay,
# takers sold soon-dead buckets for $3,330 of profit in the ten minutes
# before such reports. Needs WM_KNMI_API_KEY; idle without it.
# Replay of 2 October 2026 (123 days with KNMI's readings): 4 trades, all
# won, +$81.10; the best variant on June–July won all 4 of its trades in
# August–September (+$56.41). The next METAR raised the high after 194 of
# 199 readings 0.3–0.5 °C above the rounding edge (0.975, 95 % CI 0.943 …
# 0.989) and after all 137 readings further above it.
[strategies.knmi_nowcast]
enabled = true
mean_margin_tenths = 3            # ten-minute mean ≥ high + 0.5 + 0.3 °C
require_max_at_edge = true        # and the ten-minute maximum ≥ high + 0.5 °C
max_age_minutes = 12              # the reading's interval ended ≤ 12′ ago …
max_lead_minutes = 16             # … and ≤ 16′ before the report it anticipates
min_price = "0.02"                # the NO of the high's bucket …
max_price = "0.85"                # … at most this (the EV rule binds near 0.87)
p_new_high = 0.94                 # measured: the lower 95 % bound at this margin
min_edge = 0.05                   # EV per share at p_new_high, after fee and slippage
notional = "25.00"
max_data_age_minutes = 40
max_book_age_ms = 15000
slippage_allowance = "0.01"

[strategies.unwind]
enabled = true
exit_below_probability = 0.5
# Strategies that hold to settlement by design: their positions start below
# the exit probability (a cheap YES, the NO of a middle bucket, a quote's
# inventory), so the unwind engine leaves them alone.
exempt_strategies = ["G_tail_seller", "H_next_degree", "I_middle_fade", "J_morning_maker", "K_knmi_nowcast"]
[strategies.unwind.style]
style = "best_bid"

[model]
# Trained EmpiricalPeakModel JSON. Unset: <auto_train.data_dir>/models/<station>.json
# (e.g. /data/models/eham.json). Until a model exists the engine uses the
# no-edge model and strategies A, B and E cannot trade (fail closed); only D,
# which trades outcomes the observations have already decided, needs none.
# path = "/data/models/eham.json"

# When the model file is missing, `run` downloads the station's METAR history
# from IEM (cached per year under data_dir/research/iem), trains the model,
# writes it and the survival report, and restarts once to load it.
# Disable with WM_MODEL_AUTO_TRAIN=false. Manual: `weather-machine model train`.
[model.auto_train]
enabled = true
data_dir = "/data"
from_year = 2005
min_days = 730                    # refuse a model built from fewer usable days
retry_after_secs = 21600          # after a failed attempt
retrain_after_days = 30           # background retrain (current model keeps trading); 0 = never

# ---------------------------------------------------------------------------
# Day-1 forecast as a model feature — MEASURED, NOT ASSUMED. Training joins
# the forecast history with the METAR history and runs a walk-forward test
# with a placebo control (docs/blueprint/19-forecast-layer.md). The forecast
# changes trading probabilities only if that test adopts it; otherwise it is
# fetched and shown on the dashboard, nothing more. WM_FORECAST=false turns
# it off entirely.
# ---------------------------------------------------------------------------
[forecast]
enabled = true
model = "gfs_global"              # 2 m temperature archived since 2021 (longest history)
lead_days = 1                     # every value forecast 24 h before its valid time
ready_local_minute = 480          # a day's series is used from 08:00 local (knowledge rule)
refresh_minutes = 60
history_from = "2021-03-01"
min_eval_days = 365               # the test needs at least a year of scored days

# KNMI's ten-minute readings (strategy K and `research market`). Polled only
# while WM_KNMI_API_KEY is set.
[knmi]
enabled = true
mean_parameter = "ta"             # mean 1.5 m air temperature over the ten minutes
max_parameter = "tx"              # its maximum
location_id = ""                  # empty: the WIGOS id of the station's WMO number (0-20000-0-06240)
poll_seconds = 30
lookback_minutes = 40
