# Weather Machine — main configuration.
#
# Deployment-specific and secret values come from the environment, never from
# this file: WM_DATABASE_URL, WM_CONTACT (NWS User-Agent contact), WM_ADMIN_TOKEN,
# optional WM_MODE / WM_HTTP_BIND / WM_UI_DIR / WM_MODEL_PATH / WM_LOG_FORMAT.

[app]
mode = "paper"                    # paper | backtest | live (live is refused by this build)
instance = "wm-1"
http_bind = "0.0.0.0:8080"
ui_dir = "ui/dist"                # built Rust/WASM dashboard (Docker: /app/ui)
log_format = "pretty"             # pretty | json
locations_dir = "configs/locations"
auto_migrate = true
journal = true                    # durable event journal (crash recovery / exact replay)
record_orderbooks = true          # historical books are not available from the venue: record them
book_record_interval_secs = 10    # a token's book is stored when it changed, at most every 10 s
journal_book_retention_days = 7   # order-book updates in the replay journal (0 = keep forever)
heartbeat_secs = 60
snapshot_interval_ms = 500        # dashboard push cadence (never affects trading)

[identity]
user_agent_template = "WeatherMachine/{version} ({contact})"

[database]
max_connections = 10

# ---------------------------------------------------------------------------
# Providers. Each has its OWN rate-limit policy; NOAA-class floors (30 s,
# concurrency 1, Retry-After mandatory) are compiled in and cannot be lowered.
# ---------------------------------------------------------------------------
[providers.awc]
enabled = true
base_url = "https://aviationweather.gov"
[providers.awc.policy]
class = "noaa_nws"
min_interval_secs = 30.0
max_concurrency = 1
timeout_secs = 20.0
connect_timeout_secs = 10.0
backoff_base_secs = 60.0
backoff_max_secs = 1800.0
throttle_backoff_base_secs = 300.0
respect_retry_after = true
max_retry_after_secs = 21600.0
circuit_failure_threshold = 5
circuit_open_base_secs = 600.0
circuit_open_max_secs = 7200.0
daily_budget = 2000
politeness_factor = 2
politeness_decay_secs = 86400.0
max_body_bytes = 2097152

[providers.tgftp]
enabled = true
base_url = "https://tgftp.nws.noaa.gov"
[providers.tgftp.policy]
class = "noaa_nws"
min_interval_secs = 60.0
max_concurrency = 1
timeout_secs = 20.0
connect_timeout_secs = 10.0
backoff_base_secs = 120.0
backoff_max_secs = 1800.0
throttle_backoff_base_secs = 600.0
respect_retry_after = true
max_retry_after_secs = 21600.0
circuit_failure_threshold = 5
circuit_open_base_secs = 600.0
circuit_open_max_secs = 7200.0
daily_budget = 1000
politeness_factor = 2
politeness_decay_secs = 86400.0
max_body_bytes = 65536

[providers.nws_api]
enabled = false                   # enable only after Phase 0 confirms EHAM coverage on api.weather.gov
base_url = "https://api.weather.gov"
[providers.nws_api.policy]
class = "noaa_nws"
min_interval_secs = 60.0
max_concurrency = 1
timeout_secs = 20.0
connect_timeout_secs = 10.0
backoff_base_secs = 120.0
backoff_max_secs = 1800.0
throttle_backoff_base_secs = 600.0
respect_retry_after = true
max_retry_after_secs = 21600.0
circuit_failure_threshold = 5
circuit_open_base_secs = 600.0
circuit_open_max_secs = 7200.0
daily_budget = 1000
politeness_factor = 2
politeness_decay_secs = 86400.0
max_body_bytes = 2097152

[providers.polymarket_gamma]
enabled = true
base_url = "https://gamma-api.polymarket.com"
[providers.polymarket_gamma.policy]
class = "exchange"
min_interval_secs = 1.0
max_concurrency = 1
timeout_secs = 10.0
