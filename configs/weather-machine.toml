# ---------------------------------------------------------------------------
# Adaptive polling (engineering starting points — NOT optimized parameters).
# Fast intervals apply only inside the arrival window after an expected report:
# up to max_polls_per_window quick polls every window_interval_secs, then one
# every late_interval_secs until the window closes (a late report is still seen
# within a minute or two), then the background interval.
# ---------------------------------------------------------------------------
[polling]
night_start_minute = 1320         # 22:00 local
night_end_minute = 300            # 05:00 local
stale_slowdown_after_secs = 7200
stale_interval_secs = 1200
# While a window poll finds the expected report missing, also ask the standby
# source (TGFTP) whenever its own gate allows. The report records which source
# delivered each METAR first.
poll_standby_in_window = true
[polling.low]
window_interval_secs = 120
late_interval_secs = 180
background_interval_secs = 900
max_polls_per_window = 3
[polling.normal]
window_interval_secs = 60
late_interval_secs = 90
background_interval_secs = 600
max_polls_per_window = 6
[polling.peak]
window_interval_secs = 30
late_interval_secs = 60
background_interval_secs = 300
max_polls_per_window = 10

[health]
stale_after_secs = 2700           # 30-min cadence + 15-min allowance
degraded_latency_ms = 5000         # average and latest request both slower ⇒ Degraded
unavailable_after_failures = 3
throttle_memory_secs = 1800

# ---------------------------------------------------------------------------
# Risk ($10 per position, $100 global worst-case exposure). FAIL CLOSED.
# ---------------------------------------------------------------------------
[risk]
position_size_usd = "10.00"
# The portfolio-wide caps below are the $10-per-position limits (100 / 50 /
# 60) plus one position of strategy F (its own caps at the end of [risk]).
global_max_exposure_usd = "200.00"
max_market_exposure_usd = "30.00"
max_location_exposure_usd = "150.00"
max_strategy_exposure_usd = "60.00"
max_daily_new_exposure_usd = "160.00"
max_daily_loss_usd = "30.00"
max_spread = "0.05"
max_price = "0.99"
min_price = "0.01"
max_weather_age_minutes = 40
max_book_age_ms = 15000
correction_cooldown_minutes = 10
max_orders_per_minute = 6
require_approved_resolution_spec = false   # set true before any live consideration
# Strategy F buys a fixed 100 shares (at most 0.95 each): its own position,
# market and strategy caps. Every other strategy keeps the defaults above.
[risk.strategy_caps.F_peak_slot]
position_size_usd = "100.00"
max_market_exposure_usd = "110.00"
max_strategy_exposure_usd = "110.00"

# ---------------------------------------------------------------------------
# Strategies (research parameters; see docs/blueprint/14-research-methodology.md)
# ---------------------------------------------------------------------------
# The book is information. A and B pool the model's probability with the
# market's (midpoint of a fresh book with spread <= max_market_spread):
# logit(p) = w·logit(market) + (1−w)·logit(model), capped at the model's
# probability — the market can veto a trade, never create one. With
# market_weight > 0 a book too wide (or one-sided, or crossed) to give that
# midpoint blocks the trade: nothing checks the model then.
# market_weight: 0 = model only, 1 = market only. `weather-machine research
# market` estimates the best weight from settled markets.
[strategies.buy_yes]
enabled = true
min_price = "0.90"
max_price = "0.99"
min_confirmation_minutes = 60
min_edge = 0.01
min_model_support = 50
max_data_age_minutes = 40
max_book_age_ms = 15000
slippage_allowance = "0.005"
market_weight = 0.5
max_market_spread = "0.10"

[strategies.buy_no]
enabled = true
distances = [1, 2, 3]
min_price = "0.90"
max_price = "0.99"
min_confirmation_minutes = 60
min_edge = 0.01
min_model_support = 50
max_data_age_minutes = 40
max_book_age_ms = 15000
slippage_allowance = "0.005"
market_weight = 0.5
max_market_spread = "0.10"

# Strategy D: outcomes the observations have decided. When every resolution
# view has seen a high of H, buckets entirely below H lose (buy their NO) and
# an open-ended top bucket "≥ L" with L ≤ H wins (buy its YES) — no model.
# The edge is speed: quotes on the bucket that just died can be stale for a
# moment after the report. A high more than max_jump_tenths above the report
# before it waits for a second report.
[strategies.certain]
enabled = true
max_price = "0.99"
min_edge = 0.02                   # profit per share after fee and slippage; skips 0.98–0.99 asks
                                  # on long-dead buckets (settlement discount, not a stale quote)
slippage_allowance = "0.002"
max_data_age_minutes = 40
max_book_age_ms = 15000
max_jump_tenths = 30

# Strategy E: buy YES on the bucket holding the day's high once the clock,
# the temperature and the order book agree — inside the local time window,
# the high first reached ≥ min_minutes_at_high ago and the latest report
# ≥ min_drop_tenths below it, the YES shares offered up to max_price down by
# ≥ min_depth_shrink over lookback_minutes with the best ask not falling, and
# the ask within [min_price, max_price]. Rule-based: it claims no model edge,
# but like A and B it stays silent without a loaded model, and min_model_p > 0
# also makes the model's probability a veto. Its premise — late favourites
# win slightly more often than their price — is thin against fee and spread,
# so treat it as a hypothesis: `research market` replays it at traded prices.
# Switched off: in the 120-day replay it won 76 of 79 trades and still lost
# $7.72, and live its conditions never held while the ask was in range.
# Its losses would also count toward the daily loss limit F needs. The
# replay keeps showing what it would have done; its page keeps its history.
[strategies.book_confirmed]
enabled = false
start_local_minute = 720          # 12:00 local
end_local_minute = 1080           # 18:00 local (exclusive)
min_minutes_at_high = 60          # since the first report at the high
min_drop_tenths = 10              # latest report ≥ 1.0 °C below the high
lookback_minutes = 30
min_depth_shrink = 0.30           # ≥ 30 % of the offered shares gone
min_depth_shares = 50.0           # fewer offered at the start: no signal
min_price = "0.90"
max_price = "0.99"
min_model_p = 0.0                 # 0 = no veto; e.g. 0.90 to require the model's agreement
max_data_age_minutes = 40
max_book_age_ms = 15000
slippage_allowance = "0.005"      # for the EV shown (not a gate)

# Strategy F — the high's bucket inside the season's peak slot. The model's
# training learns, per season, the local time at which each day's high was
# first reported (METAR history); F trades between two quantiles of it. When
# the bucket holding the day's high so far is offered above min_price, F buys
# `shares` of its YES at once, paying at most max_price for every share.
# HYPOTHESIS TO BACKTEST: `research market` replays F and its variants.
# Slot: the operator's choice after the 122-day replay (1 Oct 2026), where
# the median → 90 % slot lost $122 over 84 trades and 75 % → 95 % made $11
# over 80 (per trade about +$0.14, 95 % CI −$5.93 … +$5.14). That is within
# noise and was picked after seeing the data: a hypothesis to confirm on
# later days, not an edge. The replay keeps reporting the median slot.
[strategies.peak_slot]
enabled = true
slot_from_quantile = 0.75         # from the time 75 % of days first report their high
slot_to_quantile = 0.95           # … to the time 95 % of days have it
min_price = "0.90"                # the best ask must be above this
max_price = "0.95"                # all shares at or below this
shares = 100
min_drop_tenths = 0               # 0 = no temperature condition (10 = ≥ 1 °C below the high)
max_data_age_minutes = 40
max_book_age_ms = 15000
slippage_allowance = "0.005"      # for the EV shown (not a gate)
# Only until the model carries the history's peak times (local time):
[strategies.peak_slot.fallback_slots]
winter = "13:00-16:00"
spring = "14:30-17:30"
summer = "15:00-18:00"
autumn = "14:00-17:00"

[strategies.split_unwind]
enabled = false                   # research only; risk rejects outside backtests
max_confirmation_minutes = 30
min_combined_p = 0.90
max_combined_price = "0.95"
max_data_age_minutes = 40

[strategies.unwind]
enabled = true
exit_below_probability = 0.5
[strategies.unwind.style]
style = "best_bid"

[model]
# Trained EmpiricalPeakModel JSON. Unset: <auto_train.data_dir>/models/<station>.json
# (e.g. /data/models/eham.json). Until a model exists the engine uses the
# no-edge model and strategies A, B and E cannot trade (fail closed); only D,
# which trades outcomes the observations have already decided, needs none.
# path = "/data/models/eham.json"

# When the model file is missing, `run` downloads the station's METAR history
# from IEM (cached per year under data_dir/research/iem), trains the model,
# writes it and the survival report, and restarts once to load it.
# Disable with WM_MODEL_AUTO_TRAIN=false. Manual: `weather-machine model train`.
[model.auto_train]
enabled = true
data_dir = "/data"
from_year = 2005
min_days = 730                    # refuse a model built from fewer usable days
retry_after_secs = 21600          # after a failed attempt
retrain_after_days = 30           # background retrain (current model keeps trading); 0 = never

# ---------------------------------------------------------------------------
# Day-1 forecast as a model feature — MEASURED, NOT ASSUMED. Training joins
# the forecast history with the METAR history and runs a walk-forward test
# with a placebo control (docs/blueprint/19-forecast-layer.md). The forecast
# changes trading probabilities only if that test adopts it; otherwise it is
# fetched and shown on the dashboard, nothing more. WM_FORECAST=false turns
# it off entirely.
# ---------------------------------------------------------------------------
[forecast]
enabled = true
model = "gfs_global"              # 2 m temperature archived since 2021 (longest history)
lead_days = 1                     # every value forecast 24 h before its valid time
ready_local_minute = 480          # a day's series is used from 08:00 local (knowledge rule)
refresh_minutes = 60
history_from = "2021-03-01"
min_eval_days = 365               # the test needs at least a year of scored days
