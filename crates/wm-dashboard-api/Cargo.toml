[package]
name = "wm-dashboard-api"
description = "Typed JSON contract between the Weather Machine server and its Rust/WASM dashboard (serde only, wasm-friendly)."
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "LicenseRef-Proprietary"
publish = false

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0.151"

[lints]
workspace = true
